version: "2"
sql:
  - engine: postgresql
    schema: db/init.sql
    queries: generated/queries.sql
    gen:
      go:
        package: db
        out: dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        query_parameter_limit: 0
        overrides:
          - db_type: pg_catalog.json
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: pg_catalog.json
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
        # sqlc applies element-type overrides to arrays too. Pointers preserve
        # SQL NULL elements; scalar fields also use these pointer types.
          - db_type: pg_catalog.int2
            go_type:
              type: int16
              pointer: true
          - db_type: pg_catalog.int4
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.float4
            go_type:
              type: float32
              pointer: true
          - db_type: pg_catalog.float8
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.bool
            go_type:
              type: bool
              pointer: true
          - db_type: text
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.varchar
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.bpchar
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int8
            go_type:
              type: int64
              pointer: true
